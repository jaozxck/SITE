<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Formulário de Login Acessível</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main>
    <section class="login-card" aria-labelledby="login-heading">
      <h2 id="login-heading" class="login-card__title">Entrar na Conta</h2>
      
      <form onsubmit="event.preventDefault(); alert('Formulário enviado com sucesso!');">
        <div class="form-group">
          <label for="user-email" class="form-label">E-mail</label>
          <input 
            type="email" 
            id="user-email" 
            name="email" 
            class="form-input" 
            required 
            aria-describedby="email-hint"
          />
          <small id="email-hint" class="form-hint">Exemplo: nome@servidor.com</small>
        </div>

        <div class="form-group">
          <label for="user-password" class="form-label">Palavra-passe</label>
          <input 
            type="password" 
            id="user-password" 
            name="password" 
            class="form-input" 
            required 
          />
        </div>

        <button type="submit" class="btn-submit">
          Entrar no Sistema
        </button>
      </form>
    </section>
  </main>

</body>
</html>
